name: Deploy Action Plan 27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Action plan 27/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Action plan 27
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: Action plan 27
        env:
          VITE_BASE_PATH: /action-plan-27/
        run: pnpm build

      - name: Add GitHub Pages fallback
        run: |
          cp "Action plan 27/dist/public/index.html" "Action plan 27/dist/public/404.html"
          touch "Action plan 27/dist/public/.nojekyll"

      - name: Sync branch-based Pages files
        run: |
          mkdir -p assets
          rsync -a --delete "Action plan 27/dist/public/assets/" assets/
          cp "Action plan 27/dist/public/index.html" index.html
          cp "Action plan 27/dist/public/404.html" 404.html
          cp "Action plan 27/dist/public/.nojekyll" .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll assets
          if ! git diff --cached --quiet; then
            git commit -m "Sync GitHub Pages files"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Action plan 27/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
